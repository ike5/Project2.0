# Phase 0-1 development stack: just the data tier.
# The app runs on your host (mvn spring-boot:run) so you can attach a debugger.
#
#   docker compose -f compose.dev.yml up -d
#   docker compose -f compose.dev.yml ps        # both must be (healthy)
#   docker compose -f compose.dev.yml down -v   # -v drops volumes too

name: pulse-dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: pulse-postgres
    environment:
      POSTGRES_USER: pulse
      POSTGRES_PASSWORD: pulse
      POSTGRES_DB: pulse
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulse -d pulse"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    command:
      # Verbose enough to see what the course is teaching, quiet enough to read.
      - "postgres"
      - "-c"
      - "log_min_duration_statement=200"   # log anything slower than 200ms
      - "-c"
      - "shared_preload_libraries=pg_stat_statements"
      - "-c"
      - "max_connections=100"

  redis:
    image: redis:7-alpine
    container_name: pulse-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "PING"]
      interval: 5s
      timeout: 3s
      retries: 10
    command:
      - "redis-server"
      - "--appendonly"
      - "yes"
      - "--maxmemory"
      - "512mb"
      - "--maxmemory-policy"
      - "noeviction"          # a chat backbone must NOT silently drop state;
                              # we want the error, loudly. Module 08 discusses.
      - "--slowlog-log-slower-than"
      - "5000"                # microseconds

volumes:
  pgdata:
  redisdata:
