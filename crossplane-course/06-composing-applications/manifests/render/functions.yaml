# Function definitions for offline rendering with `crossplane render`.
# The runtime annotation makes the CLI run each function as a local container.
apiVersion: pkg.crossplane.io/v1
kind: Function
metadata:
  name: function-go-templating
  annotations:
    render.crossplane.io/runtime: Docker
spec:
  package: xpkg.upbound.io/crossplane-contrib/function-go-templating:v0.9.2
---
apiVersion: pkg.crossplane.io/v1
kind: Function
metadata:
  name: function-auto-ready
  annotations:
    render.crossplane.io/runtime: Docker
spec:
  package: xpkg.upbound.io/crossplane-contrib/function-auto-ready:v0.4.1
---
apiVersion: pkg.crossplane.io/v1
kind: Function
metadata:
  name: function-sequencer
  annotations:
    render.crossplane.io/runtime: Docker
spec:
  package: xpkg.upbound.io/crossplane-contrib/function-sequencer:v0.2.1
