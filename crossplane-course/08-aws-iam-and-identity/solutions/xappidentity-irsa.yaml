# Challenge 08 Tasks 1, 2 and 4 — XAppIdentity with a permissions boundary,
# cross-account targeting, and IRSA instead of IAM users.
#
# Diff against ../manifests/composition.yaml to see the changes.
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: xappidentity-aws-irsa
  labels:
    provider: aws
    auth: irsa
spec:
  compositeTypeRef:
    apiVersion: platform.acme.io/v1alpha1
    kind: XAppIdentity
  mode: Pipeline
  pipeline:
    - step: render
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{- $xr := .observed.composite.resource -}}
            {{- $ns := $xr.metadata.namespace -}}
            {{- $name := $xr.metadata.name -}}
            {{- $sa := $xr.spec.serviceAccountName -}}
            {{- $roleName := printf "%s-%s" $ns $name -}}

            {{/* TASK 2: pick the target account's ProviderConfig. Note that the
                 composition does NOT enforce which account a namespace may
                 target -- see solution.md, that must be an admission policy and,
                 better, separate control planes per environment. */}}
            {{- $account := $xr.spec.account | default "dev" -}}
            {{- $pc := printf "account-%s" $account -}}
            {{- $accounts := dict "dev" "111111111111" "staging" "222222222222" "prod" "333333333333" -}}
            {{- $accountId := index $accounts $account -}}
            {{- $oidcHost := "oidc.eks.us-east-1.amazonaws.com/id/EXAMPLED539D4633E53DE1B71EXAMPLE" -}}

            ---
            apiVersion: iam.aws.upbound.io/v1beta1
            kind: Role
            metadata:
              annotations:
                {{ setResourceNameAnnotation "role" }}
                crossplane.io/external-name: {{ $roleName }}
            spec:
              forProvider:
                # TASK 1: cap what this role can EVER do, regardless of what
                # policies are attached to it now or later.
                permissionsBoundary: {{ printf "arn:aws:iam::%s:policy/AppIdentityBoundary" $accountId }}
                # TASK 4: IRSA trust -- no user, no access key, no stored secret.
                # The Condition pins the role to ONE ServiceAccount in ONE
                # namespace; without it any pod in the cluster could assume it.
                assumeRolePolicy: |
                  {
                    "Version": "2012-10-17",
                    "Statement": [
                      {
                        "Effect": "Allow",
                        "Principal": {
                          "Federated": "arn:aws:iam::{{ $accountId }}:oidc-provider/{{ $oidcHost }}"
                        },
                        "Action": "sts:AssumeRoleWithWebIdentity",
                        "Condition": {
                          "StringEquals": {
                            "{{ $oidcHost }}:sub": "system:serviceaccount:{{ $ns }}:{{ $sa }}",
                            "{{ $oidcHost }}:aud": "sts.amazonaws.com"
                          }
                        }
                      }
                    ]
                  }
                tags:
                  team: {{ $ns }}
                  account: {{ $account }}
              providerConfigRef:
                name: {{ $pc }}

            {{- $statements := list -}}
            {{- range $b := ($xr.spec.buckets | default list) }}
              {{- $objectActions := list "s3:GetObject" -}}
              {{- if eq $b.access "readwrite" }}
                {{- $objectActions = list "s3:GetObject" "s3:PutObject" "s3:DeleteObject" -}}
              {{- end }}
              {{- $statements = append $statements (dict
                    "Sid" (printf "Objects%s" (regexReplaceAll "[^a-zA-Z0-9]" $b.name ""))
                    "Effect" "Allow"
                    "Action" $objectActions
                    "Resource" (printf "arn:aws:s3:::%s/*" $b.name)) -}}
              {{- $statements = append $statements (dict
                    "Sid" (printf "List%s" (regexReplaceAll "[^a-zA-Z0-9]" $b.name ""))
                    "Effect" "Allow"
                    "Action" (list "s3:ListBucket")
                    "Resource" (printf "arn:aws:s3:::%s" $b.name)) -}}
            {{- end }}

            {{- if $statements }}
            ---
            apiVersion: iam.aws.upbound.io/v1beta1
            kind: Policy
            metadata:
              annotations:
                {{ setResourceNameAnnotation "policy" }}
                crossplane.io/external-name: {{ printf "%s-access" $roleName }}
            spec:
              forProvider:
                name: {{ printf "%s-access" $roleName }}
                policy: {{ dict "Version" "2012-10-17" "Statement" $statements | toJson | quote }}
              providerConfigRef:
                name: {{ $pc }}
            ---
            apiVersion: iam.aws.upbound.io/v1beta1
            kind: RolePolicyAttachment
            metadata:
              annotations:
                {{ setResourceNameAnnotation "attachment" }}
            spec:
              forProvider:
                roleSelector:
                  matchControllerRef: true
                policyArnSelector:
                  matchControllerRef: true
              providerConfigRef:
                name: {{ $pc }}
            {{- end }}

            ---
            apiVersion: v1
            kind: ServiceAccount
            metadata:
              annotations:
                {{ setResourceNameAnnotation "serviceaccount" }}
                eks.amazonaws.com/role-arn: {{ printf "arn:aws:iam::%s:role/%s" $accountId $roleName }}
              name: {{ $sa }}
              namespace: {{ $ns }}
            ---
            apiVersion: platform.acme.io/v1alpha1
            kind: XAppIdentity
            status:
              serviceAccountName: {{ $sa }}
              roleArn: {{ printf "arn:aws:iam::%s:role/%s" $accountId $roleName }}
    - step: ready
      functionRef:
        name: function-auto-ready
