# DELIBERATELY BAD — used in lab.md Part E.
#
# Every one of these is something that appears in real production accounts,
# usually written by someone in a hurry who intended to tighten it later.
apiVersion: iam.aws.upbound.io/v1beta1
kind: Policy
metadata:
  name: dangerous-policy
spec:
  forProvider:
    name: dangerous-policy
    policy: |
      {
        "Version": "2012-10-17",
        "Statement": [
          {
            "Sid": "WayTooBroad",
            "Effect": "Allow",
            "Action": "*",
            "Resource": "*"
          },
          {
            "Sid": "CanEscalatePrivileges",
            "Effect": "Allow",
            "Action": ["iam:CreatePolicyVersion", "iam:AttachRolePolicy"],
            "Resource": "*"
          },
          {
            "Sid": "ListBucketOnWrongArn",
            "Effect": "Allow",
            "Action": ["s3:ListBucket"],
            "Resource": "arn:aws:s3:::my-bucket/*"
          }
        ]
      }
  providerConfigRef:
    name: default
