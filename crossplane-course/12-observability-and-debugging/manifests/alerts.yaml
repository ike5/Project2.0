# Prometheus alerts for a Crossplane control plane.
#
# THE DESIGN PRINCIPLE, which matters more than any individual rule:
#
#   Alert on FAILURE TO CONVERGE, not on NOT-YET-CONVERGED.
#
# Synced=False is a completely normal transient state -- every subnet in Module
# 07 was unsynced until its VPC existed. An alert on the raw condition fires on
# every healthy creation, gets muted within a week, and then never helps anyone
# again. DURATION is what separates "still working on it" from "stuck".
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: crossplane
  namespace: monitoring
  labels:
    release: prometheus
spec:
  groups:
    - name: crossplane.resources
      rules:
        # An hour is longer than every legitimate convergence: the slowest thing
        # in this course is real RDS at 5-15 minutes, so this gives ~4x headroom
        # while still catching a stuck resource the same working day.
        - alert: CrossplaneResourceStuckNotReady
          expr: |
            min_over_time(crossplane_managed_resource_ready[1h]) == 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.kind }}/{{ $labels.name }} has been not-Ready for over an hour"
            description: >-
              This is past every normal provisioning time, so it is stuck rather
              than slow. Run:
              crossplane trace {{ $labels.kind }} {{ $labels.name }}
              and read the Synced condition's message.

        # Losing credentials or an endpoint takes EVERYTHING down at once. That
        # is a different, more urgent problem than one stuck resource.
        - alert: CrossplaneManyResourcesUnsynced
          expr: |
            count(crossplane_managed_resource_synced == 0) > 10
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "More than 10 managed resources are unsynced"
            description: >-
              A broad failure, not an individual one. Check credentials, the
              ProviderConfig endpoint, and whether a provider was just upgraded.

    - name: crossplane.controllers
      rules:
        - alert: CrossplaneReconcileErrorRateHigh
          expr: |
            sum(rate(controller_runtime_reconcile_errors_total{job=~".*crossplane.*"}[10m])) by (controller)
              > 0.5
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.controller }} is erroring on reconcile"
            description: >-
              Usually cloud API throttling or an expired credential. Check the
              provider pod's logs.

        - alert: CrossplaneProviderDown
          expr: |
            up{job=~".*provider.*"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Provider {{ $labels.job }} is not responding"
            description: >-
              Nothing it manages is being reconciled, and no drift is being
              corrected. Existing cloud resources keep running.

        # p99 climbing is the early warning for throttling -- it shows up here
        # before it shows up as errors.
        - alert: CrossplaneReconcileSlow
          expr: |
            histogram_quantile(0.99,
              sum(rate(controller_runtime_reconcile_time_seconds_bucket[10m])) by (le, controller)
            ) > 30
          for: 20m
          labels:
            severity: info
          annotations:
            summary: "{{ $labels.controller }} p99 reconcile time is over 30s"
            description: >-
              Often the first sign of cloud API rate limiting. Consider raising
              --poll-interval or narrowing your MRAP.
