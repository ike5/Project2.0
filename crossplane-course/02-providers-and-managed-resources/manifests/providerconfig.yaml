# How the AWS providers authenticate, and where they send requests.
#
# This is the ONE object that differs between this course and real AWS. Every other
# manifest you write is production-shaped. See Module 08 for the real-AWS version.
apiVersion: aws.upbound.io/v1beta1
kind: ProviderConfig
metadata:
  name: default
spec:
  credentials:
    source: Secret
    secretRef:
      namespace: crossplane-system
      name: aws-creds
      key: creds

  # Send AWS SDK calls to LocalStack instead of amazonaws.com.
  # Delete this whole block to talk to real AWS.
  endpoint:
    hostnameImmutable: true
    url:
      type: Static
      static: http://localstack.localstack.svc.cluster.local:4566

  # LocalStack doesn't implement these preflight checks. All four are
  # LocalStack-only and must be removed for real AWS.
  skip_credentials_validation: true
  skip_metadata_api_check: true
  skip_requesting_account_id: true
  skip_region_validation: true

  # LocalStack serves every bucket from one hostname, so the bucket name must be
  # in the URL path. Real S3 uses virtual-host style (bucket.s3.amazonaws.com).
  s3_use_path_style: true
