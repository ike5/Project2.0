# The guardrails RBAC cannot express.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: service-guardrails
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["platform.acme.io"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE"]
        resources: ["services"]
  validations:
    # Cost and incident attribution. Unattributable infrastructure is how
    # accounts fill with resources nobody will admit to and nobody dares delete.
    - expression: >-
        has(object.metadata.labels) && 'acme.io/owner' in object.metadata.labels
      message: >-
        Every Service must carry an acme.io/owner label naming the responsible
        team.
    # THE HOLE FOUND IN MODULE 13's CHALLENGE: `update` is not a lesser
    # permission than `create`. Changing spec.crossplane moves the XR to a
    # different composition -- bypassing every guarantee this platform makes,
    # AND destroying the composed resources, without ever needing the delete verb.
    - expression: >-
        !has(object.spec.crossplane) || !has(oldObject.spec.crossplane) ||
        object.spec.crossplane == oldObject.spec.crossplane
      message: >-
        spec.crossplane is managed by the platform and cannot be changed.
        Changing the composition would bypass this platform's guarantees and can
        destroy the resources this Service owns.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: service-guardrails
spec:
  policyName: service-guardrails
  validationActions: [Deny]
---
# Production Services cannot be deleted directly. This is on top of
# deletionPolicy: Orphan and AWS's own deletionProtection -- three independent
# layers, because losing a production database is unrecoverable.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: no-deleting-production-services
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["platform.acme.io"]
        apiVersions: ["*"]
        operations: ["DELETE"]
        resources: ["services"]
  validations:
    - expression: "oldObject.status.environment != 'prod'"
      message: >-
        Production Services cannot be deleted directly. Follow the break-glass
        procedure in RUNBOOK.md.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: no-deleting-production-services
spec:
  policyName: no-deleting-production-services
  validationActions: [Deny]
