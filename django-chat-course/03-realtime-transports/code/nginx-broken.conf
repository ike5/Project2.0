# Deliberately-broken nginx config for Lab 03 Part E.
# proxy_read_timeout is set short so you can watch an idle WebSocket die at 20s.
# Comment out proxy_http_version to see the handshake fail with 400 instead.
events {}
http {
  upstream pulse { server host.docker.internal:8000; }

  server {
    listen 80;

    # WebSocket + long-poll location
    location / {
      proxy_pass http://pulse;
      proxy_http_version 1.1;                 # remove this line -> 400 Bad Request
      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_read_timeout 20s;                 # default is 60s; short here on purpose
    }

    # SSE location WITHOUT `proxy_buffering off` -> events arrive in bursts.
    # The app sets `X-Accel-Buffering: no`, which nginx honours and fixes it.
    location /transport/sse {
      proxy_pass http://pulse;
      proxy_read_timeout 3600s;
    }
  }
}
