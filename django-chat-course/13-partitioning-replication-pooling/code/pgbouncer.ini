; Reference copy of infra/pgbouncer.ini.
;
; Lab Part D has you write this file one setting at a time, because the settings
; ARE the lesson — copying someone else's pgbouncer.ini is how people end up in
; session mode wondering why pooling did nothing. Use this to check your work.
;
; Copy to infra/pgbouncer.ini (next to compose.replica.yml) before running
;   docker compose -p pulse-repl -f compose.replica.yml --profile pool up -d

[databases]
; Named `pulse` so Django's DATABASES["default"]["NAME"] does not change when you
; point HOST at pgbouncer. The alias is the whole migration: one host, one port.
pulse = host=postgres-primary port=5432 dbname=pulse

; A second alias pointing at the REPLICA, so the DB router can pool its reads too.
; Reads are the traffic you have the most of; leaving them unpooled while
; carefully pooling writes is a common and expensive mistake.
pulse_ro = host=postgres-replica port=5432 dbname=pulse

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

; -----------------------------------------------------------------------------
; pool_mode — the single most important line in the file.
;
;   session      : a server connection is held for the whole client session.
;                  Breaks nothing. Also multiplexes nothing: 288 Django
;                  connections still become 288 Postgres backends. It exists for
;                  clients that need session state and is almost never what you
;                  want.
;   transaction  : a server connection is held for ONE TRANSACTION. This is the
;                  one that actually pools. It breaks every piece of session
;                  state: SET, advisory locks, LISTEN/NOTIFY, server-side
;                  prepared statements, temp tables, and cursors held outside a
;                  transaction. Django hits three of those by default; see the
;                  settings block at the bottom.
;   statement    : one statement. Breaks multi-statement transactions entirely,
;                  which means it breaks Django's transaction.atomic(). Do not.
; -----------------------------------------------------------------------------
pool_mode = transaction

; How many CLIENTS may connect to PgBouncer. This is cheap — a client connection
; is a socket and a small buffer, not a process. 10,000 is generous headroom for
; 3 nodes x 8 workers x 12 threads = 288.
max_client_conn = 10000

; How many SERVER connections PgBouncer opens per (database, user) pair. This is
; the number that matters, and it is small ON PURPOSE.
;
; Postgres throughput peaks at roughly (cores x 2) + effective_spindle_count
; ACTIVE connections and then DECREASES — more backends means more context
; switching, more lock contention, and more memory. On an 8-core dev box that is
; ~18. We use 25 to leave room for the relay and for maintenance.
;
; If you take one number from this file, take this one: your database wants
; DOZENS of connections, not hundreds, and PgBouncer's job is to make that
; compatible with an application that wants hundreds.
default_pool_size = 25

; Emergency headroom, handed out only when the main pool is exhausted and a
; client has been waiting `reserve_pool_timeout` seconds. Prevents one slow
; query from starving everything behind it.
reserve_pool_size = 5
reserve_pool_timeout = 3

; Close idle server connections after a minute. Keeps the backend count near
; the actual concurrency rather than near the peak.
server_idle_timeout = 60

; Recycle server connections every hour regardless. Bounds the damage from a
; backend that has accumulated state, a leaked temp table, or memory.
server_lifetime = 3600

; -----------------------------------------------------------------------------
; max_prepared_statements — the fix for psycopg 3's default behaviour.
;
; psycopg 3 promotes a query to a server-side prepared statement after its 5th
; execution (prepare_threshold=5). Under transaction pooling that statement was
; prepared on server connection A and is then executed on server connection B:
;
;     psycopg.errors.InvalidSqlStatementName:
;         prepared statement "_pg3_0" does not exist
;
; An error that appears only under load, only after warm-up, and never in
; development.
;
; TWO FIXES, and the lab measures both:
;   (a) Django side: OPTIONS = {"prepare_threshold": None}
;       Always works, on any PgBouncer version. Costs ~9% on the keyset query,
;       because you now parse and plan on every execution.
;   (b) PgBouncer 1.21+: this setting. PgBouncer tracks prepared statements per
;       pooled server connection and re-prepares them as needed, so psycopg's
;       default behaviour becomes safe again and you keep the 9%.
;
; Use (b) if your PgBouncer is new enough — check with `SHOW VERSION;` on the
; admin console — and keep (a) documented as the fallback.
; -----------------------------------------------------------------------------
max_prepared_statements = 200

; Log a line per connection event. Noisy, and worth it while you are learning
; where your connections actually come from. Turn it down once the shape is
; familiar.
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1

; Who may connect to the `pgbouncer` admin database (SHOW POOLS, SHOW STATS,
; SHOW CLIENTS, PAUSE, RESUME, RELOAD). Lab Part D lives on this console.
admin_users = pulse
stats_users = pulse

; -----------------------------------------------------------------------------
; The matching Django settings. Put them in settings.py, not here — they are
; listed together so you can see the whole contract in one place.
;
;   DATABASES["default"] = {
;       "ENGINE": "django.db.backends.postgresql",
;       "NAME": "pulse", "USER": "pulse", "PASSWORD": "pulse",
;       "HOST": "localhost", "PORT": 6432,          # <- PgBouncer, not Postgres
;
;       # Let PgBouncer own pooling. Django's persistent connections and
;       # PgBouncer's pool are both pools; running both means neither works.
;       # Connecting to PgBouncer costs 0.31 ms vs 3.14 ms for a real backend
;       # fork, which is what makes CONN_MAX_AGE=0 affordable here.
;       "CONN_MAX_AGE": 0,
;
;       # QuerySet.iterator() uses DECLARE ... CURSOR, which is session state.
;       # Under transaction pooling the FETCH lands on a different backend:
;       #   psycopg.errors.InvalidCursorName: cursor "_django_curs_..." does not exist
;       "DISABLE_SERVER_SIDE_CURSORS": True,
;
;       # Only needed if max_prepared_statements is unavailable (PgBouncer < 1.21).
;       # "OPTIONS": {"prepare_threshold": None},
;   }
;
;   DATABASES["replica"] = {..., "PORT": 6432, "NAME": "pulse_ro",
;                           "TEST": {"MIRROR": "default"}, ...}
; -----------------------------------------------------------------------------
