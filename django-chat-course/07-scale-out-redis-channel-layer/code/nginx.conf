# nginx.conf — a WebSocket-aware front door for a multi-worker Pulse.
#
#   docker run -d --name pulse-nginx -p 8090:80 \
#     --add-host=host.docker.internal:host-gateway \
#     -v "$PWD/code/nginx.conf:/etc/nginx/nginx.conf:ro" nginx:alpine
#
# Module 18 replaces this with the HA version (health checks, graceful drain,
# a `control: drain` frame before the connection is cut). This one exists to
# make three things visible: what a proxy has to do for WebSocket at all, what
# sticky sessions cost, and why `proxy_read_timeout` is the single most common
# cause of "my sockets drop every 60 seconds".

worker_processes auto;
events {
    # One connection to a client plus one upstream connection = 2 fds per
    # user. The default 512 gives you 256 chat users.
    worker_connections 65535;
}

http {
    # The Upgrade dance. `Connection` is a hop-by-hop header, so nginx does
    # not forward it by default; without this map every handshake gets a 400
    # and the error message tells you nothing useful.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    log_format pulse '$remote_addr $upstream_addr $status $request_time '
                     '"$request" node=$cookie_pulse_node';
    access_log /var/log/nginx/access.log pulse;

    upstream pulse {
        # Consistent hash on a cookie we set ourselves.
        #
        # Rejected: `ip_hash`. It is a MODULO scheme, not a consistent one, so
        # changing the upstream count remaps almost every client instead of
        # 1/n of them. It also clumps: everyone behind one corporate NAT is
        # one source IP and lands on one worker. The lab measures both.
        #
        # Rejected: no stickiness at all. Correct for message delivery once
        # the channel layer is shared -- and it throws away reconnect
        # locality and makes "which process is this user on?" unanswerable.
        hash $cookie_pulse_node consistent;

        server host.docker.internal:8000 max_fails=3 fail_timeout=10s;
        server host.docker.internal:8001 max_fails=3 fail_timeout=10s;

        keepalive 128;
    }

    server {
        listen 80;

        location / {
            # Assign a sticky key on first contact. $request_id is nginx's
            # own 32-hex-char unique id -- no state, no shared secret.
            if ($cookie_pulse_node = "") {
                add_header Set-Cookie "pulse_node=$request_id; Path=/; HttpOnly; SameSite=Lax";
            }

            proxy_pass http://pulse;

            # REQUIRED for WebSocket. HTTP/1.0 upstream (nginx's default) has
            # no Upgrade semantics and the handshake silently becomes a 400.
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # THE ONE THAT BITES EVERYONE. The default is 60s of *silence*
            # from the upstream, after which nginx closes the connection with
            # no error at either end -- Module 03 watched this happen at
            # exactly 20 seconds behind a tuned proxy. Pulse's 10-second
            # application heartbeat means 3600s is belt and braces, but the
            # heartbeat is the portable fix: you do not control the NAT
            # gateway in your customer's office.
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;

            # Buffering a stream is the opposite of what you want. With
            # buffering on, nginx accumulates frames before forwarding and
            # adds latency that looks exactly like server slowness.
            proxy_buffering off;
        }

        # Not proxied: nginx answers directly so you can tell "the proxy is
        # up" from "an app worker is up".
        location = /nginx-health {
            access_log off;
            return 200 "ok\n";
        }
    }
}
