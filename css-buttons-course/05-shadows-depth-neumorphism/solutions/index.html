<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solution 05 — Elevation lift + Neumorphic button</title>
<style>
  :root {
    /* Elevation scale — each token is a LAYERED shadow (contact + ambient) */
    --e1: 0 1px 2px rgba(0,0,0,.40), 0 1px 1px rgba(0,0,0,.30);
    --e3: 0 3px 6px rgba(0,0,0,.40), 0 6px 14px rgba(0,0,0,.30);
    --e5: 0 8px 16px rgba(0,0,0,.44), 0 20px 40px rgba(0,0,0,.32);
  }
  body {
    margin: 0; min-height: 100vh;
    display: grid; place-content: center; gap: 2rem;
    background: #0e1116; font-family: system-ui, sans-serif;
    padding: 2rem;
  }
  .row { display: flex; gap: 2rem; align-items: center; justify-content: center; flex-wrap: wrap; }

  /* ---------- A · Elevation hover-lift button (on dark) ---------- */
  .btn {
    appearance: none; border: none; font: inherit;
    display: inline-flex; align-items: center; justify-content: center; gap: .5em;
    padding: .8em 1.6em; border-radius: 12px;
    background: #4f46e5; color: #fff; font-weight: 700; line-height: 1.2;
    cursor: pointer; touch-action: manipulation; user-select: none;
    box-shadow: var(--e1);                 /* low elevation at rest */
    transition: transform .2s ease, box-shadow .2s ease;
  }
  .btn:hover  { transform: translateY(-4px); box-shadow: var(--e5); }  /* rise */
  .btn:active { transform: translateY(1px);  box-shadow: var(--e1); }  /* press in */
  .btn:focus-visible { outline: 2px solid #818cf8; outline-offset: 3px; }

  /* Stretch: glow variant — fill + glow from ONE custom property */
  .btn--glow {
    --hue: #e11d48;
    background: var(--hue);
    box-shadow: 0 0 18px -2px var(--hue);
    transition: transform .25s ease, box-shadow .25s ease;
  }
  .btn--glow:hover {
    transform: translateY(-2px);
    box-shadow: 0 0 8px -1px var(--hue), 0 0 34px 5px var(--hue);
  }
  .btn--glow:active { transform: translateY(1px); box-shadow: 0 0 10px -2px var(--hue); }

  /* ---------- B · Neumorphic button (on matching panel) ---------- */
  .neu-panel {
    background: #e0e5ec;                    /* light, non-white surface */
    border-radius: 20px; padding: 2rem;
    display: flex; gap: 1.6rem; align-items: center; justify-content: center; flex-wrap: wrap;
  }
  .neu {
    appearance: none; border: none; font: inherit; cursor: pointer;
    touch-action: manipulation; user-select: none;
    background: #e0e5ec;                    /* SAME color as the panel — required */
    color: #3b4658; font-weight: 700;
    padding: .95em 1.8em; border-radius: 16px;
    box-shadow:
      -6px -6px 12px rgba(255, 255, 255, .9),   /* light: top-left */
       6px  6px 12px rgba(163, 177, 198, .6);   /* dark:  bottom-right */
    transition: box-shadow .15s ease, color .15s ease;
  }
  .neu:hover  { color: #1f2937; }
  .neu:active {                                 /* pressed: shadows move inside */
    box-shadow:
      inset -4px -4px 8px rgba(255, 255, 255, .9),
      inset  4px  4px 8px rgba(163, 177, 198, .6);
    color: #1f2937;
  }
  .neu:focus-visible { outline: 2px solid #6b7280; outline-offset: 4px; }

  /* Stretch: circular icon-only neumorphic button */
  .neu--icon {
    padding: 0; width: 3.4rem; height: 3.4rem; border-radius: 50%;
    font-size: 1.25rem; display: inline-flex; align-items: center; justify-content: center;
  }

  h2 { color: #8b949e; font-size: .85rem; font-weight: 600; text-align: center;
       margin: 0 0 -.5rem; letter-spacing: .04em; text-transform: uppercase; }

  /* Respect reduced-motion preferences */
  @media (prefers-reduced-motion: reduce) {
    .btn, .btn--glow, .neu { transition: none; }
    .btn:hover, .btn:active, .btn--glow:hover, .btn--glow:active { transform: none; }
  }
</style>
</head>
<body>
  <h2>A · Elevation hover-lift</h2>
  <div class="row">
    <button class="btn" type="button">Hover to lift ↑</button>
    <button class="btn btn--glow" type="button">Glow variant</button>
  </div>

  <h2>B · Neumorphic (raised → pressed)</h2>
  <div class="neu-panel">
    <button class="neu" type="button">Press &amp; hold</button>
    <button class="neu neu--icon" type="button" aria-label="Like">♥</button>
  </div>
</body>
</html>
