<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buttons Course</title>
    <style>
        /* Add your CSS styles here */
        .btn {
            /* Reset default button styles */
            /* ABF */
            appearance: none;
            border: none;
            font: inherit;

            /* Button styles */
            background: #007bff;
            color: #fff;
            padding: 0.65em 1.25em;
            border-radius: 8px;
            cursor: pointer;
        }

        .btn:hover {
        }

        .btn:active {
        }

        .btn:disabled {
        }
    </style>
</head>
<body>
<button class="btn" type="button">Get started</button>
</body>
</html>
