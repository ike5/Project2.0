<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solution 09 — Loading spinner + pulse CTA</title>
<style>
  body {
    margin: 0; min-height: 100vh; display: grid; place-content: center; gap: 2rem;
    background: #0e1116; color: #e6edf3; font-family: system-ui, sans-serif;
  }
  .row { display: flex; gap: 1.25rem; align-items: center; justify-content: center;
         flex-wrap: wrap; }
  .label { color: #8b949e; font-size: .8rem; text-align: center; margin: 0 0 .6rem; }

  /* Base button — reused by every variant */
  .btn {
    appearance: none; border: none; font: inherit;
    display: inline-flex; align-items: center; justify-content: center; gap: .55em;
    padding: .7em 1.3em; border-radius: 10px;
    background: #4f46e5; color: #fff; font-weight: 600; line-height: 1.2;
    cursor: pointer; touch-action: manipulation; user-select: none;
    transition: background-color .15s ease;
  }
  .btn:hover  { background: #4338ca; }
  .btn:active { background: #3730a3; }
  .btn:focus-visible { outline: 2px solid #818cf8; outline-offset: 3px; }
  .btn:disabled { cursor: progress; }

  /* --- 1 · LOADING BUTTON with a CSS spinner --- */
  @keyframes spin { to { transform: rotate(360deg); } }
  .spinner {
    width: 1.05em; height: 1.05em; border-radius: 50%;
    border: 2px solid rgba(255,255,255,.35);   /* faint track */
    border-top-color: #fff;                    /* one bright arc */
    animation: spin 0.7s linear infinite;      /* linear = perfectly even */
  }
  .btn.is-loading { background: #4338ca; }

  /* --- 2 · ATTENTION PULSE CTA (layered: scale + expanding ring) --- */
  @keyframes pulse {
    0%, 100% { transform: scale(1);    }
    50%      { transform: scale(1.06); }
  }
  @keyframes ping-ring {
    0%   { box-shadow: 0 0 0 0 rgba(34,197,94,.55); }
    100% { box-shadow: 0 0 0 16px rgba(34,197,94,0); }
  }
  .cta {
    background: #16a34a;
    animation: pulse 1.6s ease-in-out infinite,
               ping-ring 1.6s ease-out infinite;
  }
  .cta:hover  { background: #15803d; }
  .cta:active { background: #166534; }

  /* --- STRETCH: shimmer skeleton --- */
  @keyframes shimmer {
    0%   { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }
  .skeleton {
    width: 11rem; height: 2.7rem; border: none; border-radius: 10px;
    background: linear-gradient(100deg, #1b2230 30%, #33405a 50%, #1b2230 70%);
    background-size: 200% 100%;
    animation: shimmer 1.4s linear infinite;
    color: transparent; cursor: progress;
  }

  /* --- STRETCH: self-drawing success check --- */
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .btn--success { background: #15803d; }
  .check { width: 1.15em; height: 1.15em; display: block; }
  .check path {
    fill: none; stroke: #fff; stroke-width: 3.2;
    stroke-linecap: round; stroke-linejoin: round;
    stroke-dasharray: 32; stroke-dashoffset: 32;
    animation: draw 0.45s ease-out 0.15s forwards;   /* forwards = stay drawn */
  }

  /* ===== Respect reduced motion for EVERY looping/attention effect ===== */
  @media (prefers-reduced-motion: reduce) {
    .cta, .skeleton { animation: none !important; }
    .skeleton { background: #262f42; }
    /* Functional motion → freeze but keep it readable as a busy indicator */
    .spinner { animation: none; border-top-color: #fff; opacity: .85; }
    .check path { animation: none; stroke-dashoffset: 0; }  /* show the finished check */
  }
</style>
</head>
<body>
  <div>
    <p class="label">Loading button (CSS spinner)</p>
    <div class="row">
      <button class="btn is-loading" type="button" disabled>
        <span class="spinner" aria-hidden="true"></span> Saving…
      </button>
      <button class="btn is-loading" type="button" disabled aria-label="Loading">
        <span class="spinner" aria-hidden="true"></span>
      </button>
    </div>
  </div>

  <div>
    <p class="label">Attention "pulse" CTA</p>
    <div class="row">
      <button class="btn cta" type="button">🚀 Get started</button>
    </div>
  </div>

  <div>
    <p class="label">Stretch: shimmer skeleton &amp; self-drawing check</p>
    <div class="row">
      <button class="skeleton" type="button" aria-label="Loading" disabled></button>
      <button class="btn btn--success" type="button">
        <svg class="check" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 12.5 L10 18.5 L20 6.5" />
        </svg>
        Saved
      </button>
    </div>
  </div>
</body>
</html>
